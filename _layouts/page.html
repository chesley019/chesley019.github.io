<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
  <link rel="stylesheet" href="{{ '/assets/css/redesign.css' | relative_url }}">
  <script src="https://cdn.counter.dev/script.js" data-id="4c8f7caa-2b55-46cd-a995-2c4633303773" data-utcoffset="8"></script>
  {% include gtag.html %}
</head>
<body class="redesigned{% unless page.title %} is-home{% endunless %}" itemscope itemtype="https://schema.org/WebPage">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">{% include navigation.html %}</header>
  <main id="main-content" class="site-main" itemprop="mainContentOfPage">
    {% if page.image.feature %}<img class="feature-image" src="{{ site.url }}/images/{{ page.image.feature }}" alt="{{ page.title }} feature image">{% endif %}
    <div class="content-grid">
      <aside class="profile-panel" aria-label="Profile and links">{% include author-bio.html %}</aside>
      <article class="page-content" itemscope itemtype="https://schema.org/CreativeWork">
        <div class="article-wrap" itemprop="text">{{ content }}</div>
      </article>
    </div>
  </main>
  <div class="site-footer"><footer>{% include footer.html %}</footer></div>
  <script src="{{ '/assets/js/redesign.js' | relative_url }}"></script>
  {% include scripts.html %}
</body>
</html>
